# ---------------------------------------------------------------------------
# reader.yaml - settings for the AI reader and the language-model wrapper.
# Change values here instead of changing Python code.
# ---------------------------------------------------------------------------

# Which company's AI service to call: "anthropic", "gemini" (Google) or "openai_compatible".
# (Can be overridden with LLM_PROVIDER in .env, which is the easy way to switch.)
provider: anthropic

# Model names PER PROVIDER, so switching provider also switches models. "cheap" does quick yes/no style jobs;
# "strong" does careful extraction. The AI Sprint manager may change these; nothing in the code hardcodes a model.
# (Overrides in .env: LLM_MODEL_CHEAP and LLM_MODEL_STRONG, or LLM_MODEL for strong.)
models:
  anthropic:
    cheap: claude-haiku-5-5
    strong: claude-sonnet-5-5
  gemini:                          # tested against the real Gemini API on 2026-11-08. Google retires models quickly:
    cheap: gemini-3.5-flash-lite   # re-check any time with  python -m llm.check  (it fails clearly if a name is retired).
    strong: gemini-3.5-flash       # Pinned on purpose: "-latest" aliases change behaviour silently. (3.7 / 3.8 Flash were
                                   # very slow, 60-110 s per call, when tested; 2.5 models are retired for new accounts.)
  openai_compatible:               # e.g. OpenAI itself, or Gemini through Google's OpenAI-compatible address
    cheap: gpt-4o-mini
    strong: gpt-4o

# Which of the two models each job uses.
task_models:
  relevance: cheap          # "is this page worth reading?"
  opening_phrase: cheap     # pull the "opening Winter 2026" phrase from a project page
  extract: strong           # turn a document into clean fields
  summary: strong           # plain-English flag summaries
  split_notices: strong     # split one newspaper page into separate notices

# Price per MILLION tokens, in US dollars. Used only to ESTIMATE cost and enforce the cap.
# !!! PLACEHOLDER NUMBERS - please check your provider's current price list and edit. !!!
prices_per_million_tokens:
  claude-haiku-5-5:  { input: 1.00, output: 5.00 }
  claude-sonnet-5-5: { input: 3.00, output: 15.00 }
  # Gemini 3.5 Flash / Flash-Lite: NO PRICE LISTED YET, so the (higher) default below is used for the cost cap.
  # Look up Google's current prices and add lines like:   gemini-3.5-flash: { input: ..., output: ... }
  # (thinking tokens are billed as output tokens)
  gpt-4o-mini:           { input: 0.15, output: 0.60 }    # approximate: verify
  gpt-4o:                { input: 2.50, output: 10.00 }   # approximate: verify
  default:           { input: 3.00, output: 15.00 }   # used for any model not listed above

# Spending limits (US dollars). The reader stops with a clear message instead of going over.
weekly_cost_cap_usd: 25
run_cost_cap_usd: 10

# How the wrapper talks to the service.
llm:
  timeout_seconds: 180           # Gemini can take over a minute when Google is busy
  max_retries: 5            # extra tries on rate limits (429) and server errors (5xx)
  backoff_base_seconds: 2   # wait 2s, 4s, 8s, 16s, 32s
  chars_per_token: 4        # rough estimate used BEFORE a call to check the cost cap
  openai_compatible:
    base_url_env: LLM_BASE_URL            # set in .env; default is OpenAI's address below
    default_base_url: https://api.openai.com/v1
    max_tokens_field: max_tokens          # some newer services want "max_completion_tokens"
  # Extra settings sent with every request (anthropic / openai_compatible), e.g. {temperature: 0}.
  # Left empty on purpose: some newer models reject a temperature setting.
  request_params: {}
  # Google Gemini (provider: gemini). The key goes in .env as GEMINI_API_KEY (or GOOGLE_API_KEY).
  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta
    # Merged into every Gemini request.
    generation_config: {}
    # Merged on top, for one model. THINKING: Gemini models "think" before answering; thinking tokens are billed and use
    # up maxOutputTokens (they can cut our JSON answer off). Which setting turns it down DIFFERS PER MODEL, found by
    # testing: Flash-Lite accepts thinkingLevel "minimal" but rejects thinkingBudget 0 (HTTP 400 "invalid argument"),
    # Flash accepts thinkingBudget 0. A model not listed here gets Google's default thinking. If you switch models and
    # python -m llm.check shows HTTP 400, try one of these two settings here.
    model_generation_config:
      gemini-3.5-flash-lite: {thinkingConfig: {thinkingLevel: minimal}}
      gemini-3.5-flash:      {thinkingConfig: {thinkingBudget: 0}}
      gemini-3.6-flash:      {thinkingConfig: {thinkingBudget: 0}}
    # Jobs whose answer must be JSON: Gemini is asked for JSON output (not used for plain-text summaries).
    json_tasks: [extract, relevance, opening_phrase, split_notices]
  # Gemini through Google's OpenAI-compatible address instead (provider: openai_compatible): set in .env
  #   LLM_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai   LLM_API_KEY=<your Gemini key>
  # and put Gemini model names under models.openai_compatible above.

# ---- Reader settings (used from step b on) ----
reader:
  batch_size: 10
  max_pages: 40                 # longer documents are cut down to the most relevant pages
  max_chars: 120000             # longest text sent to the model in one call
  max_output_tokens: 2500
  min_text_chars: 20            # a document with less readable text than this is not sent to the AI
  chunk_first_pages: 3          # for long documents: always send this many pages from the start
  truncation_needs_review: true # a document we had to cut down is flagged for a person
  ocr_review_share: 0.5         # flag documents where more than this share of pages needed OCR
  require_quotes: true          # every filled-in field must come with a supporting quote
  value_in_quote_min_score: 85  # how well a field's value must match its own quote (0-100)
  max_consecutive_llm_errors: 3 # stop the batch if the AI service keeps failing
  # Which kinds of files the reader processes. sec_edgar, ffiec, cms and trepp are already
  # parsed into tables by Part A, so the reader skips them.
  process_sources: [county_court, recorder, public_notice, permit, state_license,
                    manual_upload, project_site, news, auction, wsj_notice]

# Reading text out of scans and photos.
ocr:
  engine: tesseract             # the engine is swappable: see reader/ocr.py (OCR_ENGINES)
  min_chars_per_page: 40        # a PDF page with less text than this is treated as a scan
  dpi: 200
  language: eng

# ---- Privacy switches. Bloomfield decides if these ever change. ----
trepp_ai_allowed: false              # true = Trepp data may be sent to the outside AI service
bloomfield_material_ai_allowed: false  # true = files marked confidential / from manual_upload/bloomfield/
