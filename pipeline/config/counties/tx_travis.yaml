# Travis County, TX. Links from NETR Online (pulled Nov 14, 2026). Status: manual_inbox until a person checks
# each site's terms of use / robots.txt (NETR itself is approved; every county site is still screened).
county: Travis County
state: TX
fips: "48453"
status: manual_inbox
priority: 2
netr_page: "https://publicrecords.netronline.com/state/TX/county/travis"
notes: "Austin (UT). Texas non-judicial foreclosure sale notices are posted with the County Clerk before each monthly (first Tuesday) sale. NETR lists no separate GIS office for Travis."

sources:
  recorder:                       # PRIORITY 1 -> L loan clock + READY TO ACT (foreclosure postings, liens)
    access: manual_inbox
    url: "http://www.tccsearch.org/"
    phone: "(512) 854-9188"
    notes: >-
      Travis County Clerk records search. Pull: construction deeds of trust; modifications and extensions
      (any short-term loan); assignments; releases and new permanent deeds of trust (stop the clock);
      mechanic's liens, lis pendens and posted notices of foreclosure sale (READY TO ACT).
      Until checked, drop documents into data/inbox/recorder/TX/<county>/.
  court:
    access: manual_inbox
    notes: "Travis County District Clerk civil case search (not on NETR). Drop filings into data/inbox/county_court/TX/<county>/."
  public_notice:
    access: manual_inbox
    notes: "Texas Press Association public notice site and County Clerk foreclosure postings. Drop notices into data/inbox/public_notice/TX/<county>/."
  permits:                        # PRIORITY 2 -> I site inactivity + certificates of occupancy (NOT on NETR)
    access: open_data_api
    url: "https://data.austintexas.gov/d/3syk-w9eu"
    terms_url: "https://data.austintexas.gov/d/3syk-w9eu"   # dataset page; also https://data.austintexas.gov/stories/s/ranj-cccq (portal Terms of Use)
    verified_terms: true          # Confirmed by the user (Vishwa) 2026-11-15 over iMessage: "we have check with
                                  # every county beforehand and we a re approved for crawling api data scraping etc" and "Whatever goes".
                                  # Terms evidence (observed 2026-11-15 via the dataset's own metadata,
                                  # https://data.austintexas.gov/api/views/3syk-w9eu.json):
                                  # license "Public Domain U.S. Government" (https://www.usa.gov/government-works), provenance "official",
                                  # public viewer grants, official City of Austin attribution.
    max_results: 1000             # saved-record cap per run (weekly lookback is ~2-4k permits)
    api:
      format: socrata
      url: "https://data.austintexas.gov/resource/3syk-w9eu.json"
      params:
        $where: "issue_date >= '{since:%Y-%m-%dT00:00:00}'"
        $order: "issue_date DESC"
      limit_param: $limit
      offset_param: $offset
      page_size: 1000
      max_pages: 20
    fields:
      record_id: permit_number
      filing_date: issue_date
      document_type: permit_type_desc
      case_type: permit_class_mapped
      parties: applicant_org
      permit_number: permit_number
      issued_date: issue_date
      applied_date: applieddate
      completed_date: completed_date
      status: status_current
      address: original_address1
      city: original_city
      state: original_state
      zip: original_zip
      permit_class: permit_class_mapped
      permit_type: permittype
      valuation: total_job_valuation
      description: description
      work_class: work_class
      housing_units: housing_units
      permit_type_desc: permit_type_desc
    default_doc_category: building_permit   # rows with completed_date also yield certificate-of-occupancy rows in permits.py
    skip_labels: ["Residential"]
    notes: >-
      City of Austin "Issued Construction Permits" (dataset 3syk-w9eu, verified live 2026-11-15: BLDS field names,
      ~2,500 permits/month incl. commercial). Feeds filing_fields (building_permit + certificate_of_occupancy via
      completed_date) for Travis County projects; a live test run collected 571 real permits for Nov 1-14, 2026.
      This dataset has NO inspection-date columns, so the I signal's inspection feed stays unfed here; the Austin
      Build + Connect portal (abc.austintexas.gov, linked per permit) is the lead if the team later adds
      inspections by hand. Automated collection runs ONLY after a person confirms the terms and flips
      verified_terms to true (see above).

reference_sites:
  - {office: "Travis Central Appraisal District", phone: "(512) 834-9317", url: "https://www.traviscad.org/propertysearch",
     feeds: "Part C: parcel numbers and owner names; a new building's value appearing = it was finished"}
  - {office: "Tax Office", phone: "(512) 854-9473", url: "https://tax-office.traviscountytx.gov/",
     feeds: "READY TO ACT: delinquent property taxes"}
  - {office: "NETR Mapping and GIS", url: "https://map.netronline.com/texas-travis/48453", feeds: "Part C: parcel lookups"}
  - {office: "Historic Aerials", url: "https://www.historicaerials.com/", feeds: "Checking construction progress by hand"}
