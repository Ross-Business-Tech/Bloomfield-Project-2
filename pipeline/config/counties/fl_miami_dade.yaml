     feeds: "Part C: parcel numbers and owner names; a new building's value appearing = it was finished"}
  - {office: "Tax Collector", phone: "(305) 270-4916", url: "https://county-taxes.net/fl-miamidade/property-tax",
     feeds: "READY TO ACT: delinquent property taxes / tax certificates"}
  - {office: "County GIS", phone: "(305) 596-8200", url: "https://www.miamidade.gov/global/service.page?Mduid_service=ser1495571905689513",
     feeds: "Part C: parcels for matching"}
  - {office: "NETR Mapping and GIS", url: "https://map.netronline.com/florida-miami-dade/12086", feeds: "Part C: parcel lookups"}
  - {office: "Historic Aerials", url: "https://www.historicaerials.com/", feeds: "Checking construction progress by hand"}
