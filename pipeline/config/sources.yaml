# ---------------------------------------------------------------------------
# sources.yaml  -  settings shared by every collector.
# Change numbers here instead of changing Python code.
# ---------------------------------------------------------------------------

# The name of the variable in .env that holds our contact email.
contact_email_env: CONTACT_EMAIL
# Used when .env has no CONTACT_EMAIL, so the tools work with no setup. It is only written into the
# User-Agent so a website owner can reach the team. Set CONTACT_EMAIL in .env to override it.
contact_email_default: AISprint@umich.edu

# Sent as the "User-Agent" with every request. {email} is filled in from .env.
user_agent_template: "BloomfieldSourcingResearch/0.1 (University of Michigan AI Sprint; contact: {email})"

# Defaults for every website. A domain listed under "domains:" below overrides them.
defaults:
  seconds_between_requests: 3     # polite rate limit: 1 request every 3 seconds per website
  timeout_seconds: 30             # give up on a request after this long
  max_retries: 3                  # extra tries on 429 / 5xx errors (never on 401/403)
  backoff_base_seconds: 2         # wait 2s, 4s, 8s between retries

# Per-website overrides (key = the website's domain name).
domains:
  www.sec.gov:  { seconds_between_requests: 0.25 }   # SEC allows 10/sec; we use ~4/sec
  data.sec.gov: { seconds_between_requests: 0.25 }
  data.cms.gov: { seconds_between_requests: 1, timeout_seconds: 300 }   # some CMS files are large
  # NETR Online's robots.txt sets Crawl-delay: 10 for the directory pages discover.py reads.
  publicrecords.netronline.com: { seconds_between_requests: 10 }

# How far back to look when collecting county/court/recorder records.
lookback_days:
  first_run: 365    # the very first time a county is collected
  weekly_run: 14    # every run after that

# Which collectors run (and in what order) when you run everything.
enabled_collectors:
  - inbox
  - edgar
  - ffiec
  - county
  - recorded_loans
  - liens
  - permits
  - state
  - market_rents
  - cms_ops

# market_rents: the city rent index the rent-decline signal (R) compares each property's asking rents
# against. A MARKET benchmark only - never property-specific data.
market_rents:
  months: 30            # keep this many recent months per city
  sources:
    # ZORI covers the whole rental stock (SFR + condo + apartments), smoothed. R compares percent
    # changes only, never levels; new multifamily asking rents can move differently. See market_rents.py.
    - name: "Zillow ZORI (all rentals, city, smoothed, seasonally adjusted)"
      url: "https://files.zillowstatic.com/research/public_csvs/zori/City_zori_uc_sfrcondomfr_sm_month.csv"
      terms_url: "https://www.zillow.com/research/data/"
      verified_terms: false   # a person must confirm terms at the URL above before this runs. Observed
                              # 2026-11-15: the CSV downloads publicly (HTTP 200); Zillow's research page
                              # says the data is free to download and use with attribution.

# Manual inbox: if a dropped file has no sidecar .json and no category folder,
# this is the doc_category it gets, by source. Anything not listed becomes "other".
inbox:
  default_doc_category:
    permit: building_permit
    state_license: license_action
